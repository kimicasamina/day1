name: CI/CD Build and Deploy Single-Container to EC2

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # --- BUILD COMBINED IMAGE FROM ROOT CONTEXT ---
      - name: Build and Push Combined App Image
        uses: docker/build-push-action@v5
        with:
          context: . # Set to root directory so Docker can see both frontend/ and backend/
          file: ./backend/Dockerfile # Specifies where the multi-stage Dockerfile lives
          build-args: |
            VITE_CLIENT_URL=https://day1.kimcasamina.com
          push: true
          tags: kimicasamina/day1-backend:latest

  deploy-to-ec2:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Execute Remote SSH Commands to Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 15.135.224.113
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/deploy
            docker compose pull
            docker compose up -d
            docker system prune -f  # Reclaims precious EC2 storage instantly
